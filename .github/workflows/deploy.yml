name: Deploy Laravel API-SER

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            cd /var/www/smarthouse-api

            git config --global --add safe.directory /var/www/smarthouse-api
            if [ -n "$(git status --porcelain)" ]; then
              echo "Repositorio con cambios locales. Guardando respaldo en /tmp..."
              git diff > "/tmp/smarthouse-predeploy-$(date +%F-%H%M%S).patch" || true
            fi

            git fetch --prune origin main
            git reset --hard origin/main
            rm -f FETCH_HEAD

            if [ -s database/deploy/temp.sql ]; then
              echo "Aplicando dump SQL: database/deploy/temp.sql"

              env_value() {
                key="$1"
                default_value="${2:-}"
                value="$(grep -m1 "^${key}=" .env | cut -d= -f2- || true)"
                value="${value%\"}"
                value="${value#\"}"

                if [ -z "$value" ]; then
                  echo "$default_value"
                else
                  echo "$value"
                fi
              }

              DB_HOST="$(env_value DB_HOST 127.0.0.1)"
              DB_PORT="$(env_value DB_PORT 3306)"
              DB_DATABASE="$(env_value DB_DATABASE)"
              DB_USERNAME="$(env_value DB_USERNAME root)"
              DB_PASSWORD="$(env_value DB_PASSWORD)"

              if [ -z "$DB_DATABASE" ]; then
                echo "DB_DATABASE vacio en .env. Abortando deploy."
                exit 1
              fi

              MYSQL_BIN="$(command -v mysql || command -v mariadb || true)"
              if [ -z "$MYSQL_BIN" ]; then
                echo "No se encontro cliente mysql/mariadb en VPS."
                exit 1
              fi

              if [ -n "$DB_PASSWORD" ]; then
                MYSQL_PWD="$DB_PASSWORD" "$MYSQL_BIN" -h "$DB_HOST" -P "$DB_PORT" -u "$DB_USERNAME" "$DB_DATABASE" < database/deploy/temp.sql
              else
                "$MYSQL_BIN" -h "$DB_HOST" -P "$DB_PORT" -u "$DB_USERNAME" "$DB_DATABASE" < database/deploy/temp.sql
              fi
            else
              echo "No existe database/deploy/temp.sql (o esta vacio). Se omite import de BD."
            fi

            APP_USER="$(id -un)"
            APP_GROUP="www-data"
            if ! getent group "$APP_GROUP" >/dev/null 2>&1; then
              APP_GROUP="$(id -gn)"
            fi

            mkdir -p storage/logs bootstrap/cache
            touch storage/logs/laravel.log
            chown -R "$APP_USER:$APP_GROUP" storage bootstrap/cache
            find storage bootstrap/cache -type d -exec chmod 775 {} \;
            find storage bootstrap/cache -type f -exec chmod 664 {} \;

            composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction
            php artisan migrate --force
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan queue:restart
