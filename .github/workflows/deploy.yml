name: Deploy Laravel API-SER

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -Eeuo pipefail
            trap 'echo "ERROR en linea $LINENO"; exit 1' ERR

            log() { echo "[DEPLOY] $1"; }

            cd /var/www/smarthouse-api
            log "Repo: $(pwd)"

            git config --global --add safe.directory /var/www/smarthouse-api
            if [ -n "$(git status --porcelain)" ]; then
              log "Repositorio con cambios locales. Guardando respaldo en /tmp..."
              git diff > "/tmp/smarthouse-predeploy-$(date +%F-%H%M%S).patch" || true
            fi

            log "Sincronizando con origin/main"
            git fetch --prune origin main
            git reset --hard origin/main
            rm -f FETCH_HEAD

            PHP_BIN="$(command -v php8.4 || true)"
            if [ -z "$PHP_BIN" ]; then
              log "php8.4 no encontrado. Instala PHP 8.4 en el VPS."
              exit 1
            fi

            PHP_MM="$($PHP_BIN -r 'echo PHP_MAJOR_VERSION.".".PHP_MINOR_VERSION;')"
            if [ "$PHP_MM" != "8.4" ]; then
              log "PHP CLI detectado: $PHP_MM (se requiere 8.4)"
              exit 1
            fi

            COMPOSER_BIN="/usr/local/bin/composer"
            if [ ! -x "$COMPOSER_BIN" ]; then
              COMPOSER_BIN="$(command -v composer || true)"
            fi

            if [ -z "$COMPOSER_BIN" ]; then
              log "composer no encontrado en el VPS."
              exit 1
            fi

            if [ -s database/deploy/temp.sql ]; then
              log "Aplicando dump SQL: database/deploy/temp.sql"

              env_value() {
                key="$1"
                default_value="${2:-}"
                value="$(grep -m1 "^${key}=" .env | cut -d= -f2- || true)"
                value="${value%\"}"
                value="${value#\"}"

                if [ -z "$value" ]; then
                  echo "$default_value"
                else
                  echo "$value"
                fi
              }

              DB_HOST="$(env_value DB_HOST 127.0.0.1)"
              DB_PORT="$(env_value DB_PORT 3306)"
              DB_DATABASE="$(env_value DB_DATABASE)"
              DB_USERNAME="$(env_value DB_USERNAME root)"
              DB_PASSWORD="$(env_value DB_PASSWORD)"

              if [ -z "$DB_DATABASE" ]; then
                log "DB_DATABASE vacio en .env. Abortando deploy."
                exit 1
              fi

              MYSQL_BIN="$(command -v mysql || command -v mariadb || true)"
              if [ -z "$MYSQL_BIN" ]; then
                log "No se encontro cliente mysql/mariadb en VPS."
                exit 1
              fi

              if [ -n "$DB_PASSWORD" ]; then
                MYSQL_PWD="$DB_PASSWORD" "$MYSQL_BIN" -h "$DB_HOST" -P "$DB_PORT" -u "$DB_USERNAME" "$DB_DATABASE" < database/deploy/temp.sql
              else
                "$MYSQL_BIN" -h "$DB_HOST" -P "$DB_PORT" -u "$DB_USERNAME" "$DB_DATABASE" < database/deploy/temp.sql
              fi
            else
              log "No existe database/deploy/temp.sql (o esta vacio). Se omite import de BD."
            fi

            APP_USER="$(id -un)"
            APP_GROUP="www-data"
            if ! getent group "$APP_GROUP" >/dev/null 2>&1; then
              APP_GROUP="$(id -gn)"
            fi

            mkdir -p storage/logs bootstrap/cache
            touch storage/logs/laravel.log || true

            if command -v sudo >/dev/null 2>&1 && sudo -n true >/dev/null 2>&1; then
              sudo chown -R "$APP_USER:$APP_GROUP" storage bootstrap/cache
              sudo find storage bootstrap/cache -type d -exec chmod 2775 {} \;
              sudo find storage bootstrap/cache -type f -exec chmod 664 {} \;
            else
              log "Sin permisos sudo; se omite chown y se intenta ajustar permisos de grupo."
              chgrp -R "$APP_GROUP" storage bootstrap/cache 2>/dev/null || true
              chmod -R g+rwX storage bootstrap/cache 2>/dev/null || true
              find storage bootstrap/cache -type d -exec chmod g+s {} \; 2>/dev/null || true
            fi

            umask 0002
            log "Instalando dependencias"
            "$PHP_BIN" "$COMPOSER_BIN" install --no-dev --prefer-dist --optimize-autoloader --no-interaction

            log "Verificando platform requirements"
            "$PHP_BIN" "$COMPOSER_BIN" check-platform-reqs --no-dev

            log "Ejecutando tareas Laravel"
            "$PHP_BIN" artisan migrate --force
            "$PHP_BIN" artisan optimize:clear
            "$PHP_BIN" artisan config:cache
            "$PHP_BIN" artisan route:cache

            if [ -d resources/views ]; then
              "$PHP_BIN" artisan view:cache
            else
              log "No existe resources/views. Se omite view:cache."
            fi

            "$PHP_BIN" artisan queue:restart
            log "Deploy finalizado"
