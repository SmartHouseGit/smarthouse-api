name: Deploy Laravel API-SER

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build release archive
        run: |
          rm -f release.tar.gz
          tar \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='vendor' \
            --exclude='release.tar.gz' \
            --exclude='storage/logs/*' \
            --exclude='storage/framework/cache/*' \
            --exclude='storage/framework/sessions/*' \
            --exclude='storage/framework/views/*' \
            --exclude='bootstrap/cache/*.php' \
            -czf release.tar.gz .

      - name: Upload release archive to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          source: "release.tar.gz"
          target: "/tmp"

      - name: Run deploy on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -Eeuo pipefail
            trap 'echo "ERROR en linea $LINENO"; exit 1' ERR

            log() { echo "[DEPLOY] $1"; }

            APP_DIR="/var/www/smarthouse-api"
            ARCHIVE="/tmp/release.tar.gz"
            mkdir -p "$APP_DIR"
            cd "$APP_DIR"
            log "Destino: $(pwd)"

            if [ ! -f "$ARCHIVE" ]; then
              log "No se encontro $ARCHIVE en el VPS."
              exit 1
            fi

            log "Extrayendo release..."
            tar -xzf "$ARCHIVE" -C "$APP_DIR"
            rm -f "$ARCHIVE"

            PHP_BIN="$(command -v php8.4 || true)"
            if [ -z "$PHP_BIN" ]; then
              log "php8.4 no encontrado. Instala PHP 8.4 en el VPS."
              exit 1
            fi

            PHP_MM="$($PHP_BIN -r 'echo PHP_MAJOR_VERSION.".".PHP_MINOR_VERSION;')"
            if [ "$PHP_MM" != "8.4" ]; then
              log "PHP CLI detectado: $PHP_MM (se requiere 8.4)"
              exit 1
            fi

            COMPOSER_BIN="/usr/local/bin/composer"
            if [ ! -x "$COMPOSER_BIN" ]; then
              COMPOSER_BIN="$(command -v composer || true)"
            fi

            if [ -z "$COMPOSER_BIN" ]; then
              log "composer no encontrado en el VPS."
              exit 1
            fi

            log "Pasos de BD desactivados en deploy (sin import SQL ni migraciones)."

            APP_USER="$(id -un)"
            APP_GROUP="www-data"
            if ! getent group "$APP_GROUP" >/dev/null 2>&1; then
              APP_GROUP="$(id -gn)"
            fi

            mkdir -p storage/logs bootstrap/cache
            touch storage/logs/laravel.log || true

            if command -v sudo >/dev/null 2>&1 && sudo -n true >/dev/null 2>&1; then
              sudo chown -R "$APP_USER:$APP_GROUP" storage bootstrap/cache
              sudo find storage bootstrap/cache -type d -exec chmod 2775 {} \;
              sudo find storage bootstrap/cache -type f -exec chmod 664 {} \;
            else
              log "Sin permisos sudo; se omite chown y se intenta ajustar permisos de grupo."
              chgrp -R "$APP_GROUP" storage bootstrap/cache 2>/dev/null || true
              chmod -R g+rwX storage bootstrap/cache 2>/dev/null || true
              find storage bootstrap/cache -type d -exec chmod g+s {} \; 2>/dev/null || true
            fi

            umask 0002
            log "Instalando dependencias"
            "$PHP_BIN" "$COMPOSER_BIN" install --no-dev --prefer-dist --optimize-autoloader --no-interaction

            log "Verificando platform requirements"
            "$PHP_BIN" "$COMPOSER_BIN" check-platform-reqs --no-dev

            log "Ejecutando tareas Laravel"
            "$PHP_BIN" artisan optimize:clear
            "$PHP_BIN" artisan config:cache
            "$PHP_BIN" artisan route:cache

            if [ -d resources/views ]; then
              "$PHP_BIN" artisan view:cache
            else
              log "No existe resources/views. Se omite view:cache."
            fi

            "$PHP_BIN" artisan queue:restart
            log "Deploy finalizado"
